<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Blind Bazaar hosted demo system architecture</title>
  <desc id="desc">A technical architecture diagram showing the browser, DuckDNS, Google Cloud VM, Groq API, Midnight.js verifier, private witnesses, and local Midnight Docker development network.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6ed8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7f96"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7357dd"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; fill: #15213a; font-size: 52px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; fill: #536176; font-size: 23px; font-weight: 400; }
      .group-title { font-family: Arial, Helvetica, sans-serif; fill: #173152; font-size: 25px; font-weight: 700; }
      .group-subtitle { font-family: Arial, Helvetica, sans-serif; fill: #64748b; font-size: 17px; font-weight: 400; }
      .card-title { font-family: Arial, Helvetica, sans-serif; fill: #17243b; font-size: 24px; font-weight: 700; }
      .card-text { font-family: Arial, Helvetica, sans-serif; fill: #506078; font-size: 17px; font-weight: 400; }
      .card-mono { font-family: Menlo, Monaco, Consolas, monospace; fill: #173152; font-size: 16px; font-weight: 600; }
      .edge-label { font-family: Arial, Helvetica, sans-serif; fill: #315477; font-size: 16px; font-weight: 600; }
      .note { font-family: Arial, Helvetica, sans-serif; fill: #5d6a7b; font-size: 15px; font-weight: 400; }
      .legend { font-family: Arial, Helvetica, sans-serif; fill: #425168; font-size: 16px; font-weight: 600; }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="#ffffff"/>
  <rect x="0" y="0" width="2400" height="150" fill="#f6f8fb"/>
  <rect x="0" y="149" width="2400" height="1" fill="#dce3ec"/>
  <text x="80" y="73" class="title">Blind Bazaar</text>
  <text x="80" y="112" class="subtitle">Hosted demo architecture · AI negotiation bounded by private Compact witnesses and Midnight zero-knowledge proofs</text>
  <text x="2320" y="73" text-anchor="end" class="subtitle">HTTPS public edge · VM-local proof network</text>

  <!-- Public internet boundary -->
  <rect x="55" y="205" width="590" height="860" rx="16" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="85" y="250" class="group-title">Public internet</text>
  <text x="85" y="278" class="group-subtitle">Only DNS and HTTPS are exposed</text>

  <!-- Browser -->
  <rect x="105" y="500" width="270" height="250" rx="14" fill="#ffffff" stroke="#6d8cae" stroke-width="2"/>
  <rect x="105" y="500" width="270" height="48" rx="14" fill="#eef5ff"/>
  <circle cx="135" cy="524" r="7" fill="#1d6ed8"/>
  <text x="154" y="532" class="card-title">Browser UI</text>
  <text x="133" y="585" class="card-text">Auction chat</text>
  <text x="133" y="615" class="card-text">Live SSE progress</text>
  <text x="133" y="645" class="card-text">Proof status + receipt</text>
  <rect x="133" y="680" width="190" height="38" rx="7" fill="#e9f8f4"/>
  <text x="148" y="705" class="card-mono">public only</text>

  <!-- DuckDNS -->
  <rect x="150" y="325" width="270" height="112" rx="14" fill="#ffffff" stroke="#6d8cae" stroke-width="2"/>
  <rect x="150" y="325" width="270" height="40" rx="14" fill="#f4f1ff"/>
  <text x="175" y="353" class="card-title">DuckDNS</text>
  <text x="175" y="395" class="card-mono">blindbazaar-demo.duckdns.org</text>
  <text x="175" y="421" class="card-text">A record → VM external IPv4</text>

  <!-- GCP boundary -->
  <rect x="700" y="205" width="915" height="860" rx="16" fill="#fbfdff" stroke="#4888c8" stroke-width="2.5"/>
  <rect x="700" y="205" width="915" height="65" rx="16" fill="#eaf4ff"/>
  <text x="735" y="246" class="group-title">Google Cloud Compute Engine · blind-bazaar-vm</text>
  <text x="1578" y="246" text-anchor="end" class="group-subtitle">persistent disk · e2-standard-2</text>

  <!-- Caddy -->
  <rect x="750" y="330" width="250" height="170" rx="14" fill="#ffffff" stroke="#1d6ed8" stroke-width="2.5"/>
  <rect x="750" y="330" width="250" height="45" rx="14" fill="#eaf4ff"/>
  <text x="777" y="360" class="card-title">Caddy</text>
  <text x="777" y="409" class="card-text">TLS termination</text>
  <text x="777" y="438" class="card-mono">:80 → :443 redirect</text>
  <text x="777" y="468" class="card-mono">reverse proxy → :3000</text>

  <!-- Express -->
  <rect x="1060" y="330" width="505" height="170" rx="14" fill="#ffffff" stroke="#1d6ed8" stroke-width="2.5"/>
  <rect x="1060" y="330" width="505" height="45" rx="14" fill="#eaf4ff"/>
  <text x="1087" y="360" class="card-title">Express application</text>
  <text x="1087" y="409" class="card-text">Static UI · REST endpoint · Server-Sent Events</text>
  <text x="1087" y="439" class="card-mono">POST /api/negotiate/stream</text>
  <text x="1087" y="468" class="card-mono">server/negotiation.js</text>

  <!-- Agents -->
  <rect x="750" y="575" width="400" height="205" rx="14" fill="#ffffff" stroke="#12a594" stroke-width="2.5"/>
  <rect x="750" y="575" width="400" height="45" rx="14" fill="#e9f8f4"/>
  <text x="777" y="605" class="card-title">Groq AI negotiation agents</text>
  <text x="777" y="654" class="card-text">Advertiser + publisher agent sessions</text>
  <text x="777" y="684" class="card-text">Private constraints are not emitted in chat</text>
  <text x="777" y="723" class="card-mono">public result: CPM + promised quality</text>
  <text x="777" y="752" class="note">Groq receives each agent’s own prompt context</text>

  <!-- Midnight verifier -->
  <rect x="1215" y="575" width="350" height="205" rx="14" fill="#ffffff" stroke="#7357dd" stroke-width="2.5"/>
  <rect x="1215" y="575" width="350" height="45" rx="14" fill="#f4f1ff"/>
  <text x="1242" y="605" class="card-title">Midnight.js verifier</text>
  <text x="1242" y="654" class="card-mono">server/midnightReal.js</text>
  <text x="1242" y="684" class="card-mono">src/verify-deal.ts</text>
  <text x="1242" y="723" class="card-text">Wallet + proof transaction orchestration</text>
  <text x="1242" y="752" class="note">Runs as a child process from Express</text>

  <!-- Private witness boundary -->
  <rect x="750" y="845" width="815" height="165" rx="14" fill="#fbfaff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="778" y="882" class="card-title">Private witness boundary</text>
  <text x="778" y="912" class="card-text">Supplied locally during proof generation; not sent to browser or ledger</text>
  <rect x="778" y="936" width="214" height="48" rx="8" fill="#f4f1ff"/>
  <text x="800" y="966" class="card-mono">advertiser max CPM</text>
  <rect x="1010" y="936" width="214" height="48" rx="8" fill="#f4f1ff"/>
  <text x="1030" y="966" class="card-mono">publisher floor CPM</text>
  <rect x="1242" y="936" width="214" height="48" rx="8" fill="#f4f1ff"/>
  <text x="1270" y="966" class="card-mono">actual quality</text>

  <!-- Docker devnet boundary -->
  <rect x="1675" y="205" width="670" height="860" rx="16" fill="#fcfdff" stroke="#12a594" stroke-width="2.5"/>
  <rect x="1675" y="205" width="670" height="65" rx="16" fill="#e9f8f4"/>
  <text x="1710" y="238" class="group-title">Midnight development network</text>
  <text x="1710" y="262" class="group-subtitle">Docker Compose · VM-local only · not public</text>

  <!-- Proof Server -->
  <rect x="1725" y="345" width="180" height="145" rx="14" fill="#ffffff" stroke="#12a594" stroke-width="2.5"/>
  <text x="1750" y="388" class="card-title">Proof server</text>
  <text x="1750" y="425" class="card-mono">127.0.0.1:6300</text>
  <text x="1750" y="455" class="card-text">ZK proof generation</text>

  <!-- Indexer -->
  <rect x="1920" y="345" width="180" height="145" rx="14" fill="#ffffff" stroke="#12a594" stroke-width="2.5"/>
  <text x="1945" y="388" class="card-title">Indexer</text>
  <text x="1945" y="425" class="card-mono">127.0.0.1:8088</text>
  <text x="1945" y="455" class="card-text">Public-data queries</text>

  <!-- Node -->
  <rect x="2115" y="345" width="180" height="145" rx="14" fill="#ffffff" stroke="#12a594" stroke-width="2.5"/>
  <text x="2140" y="388" class="card-title">Midnight node</text>
  <text x="2140" y="425" class="card-mono">127.0.0.1:9944</text>
  <text x="2140" y="455" class="card-text">Local ledger</text>

  <!-- Contract -->
  <rect x="1775" y="600" width="470" height="190" rx="14" fill="#ffffff" stroke="#7357dd" stroke-width="2.5"/>
  <rect x="1775" y="600" width="470" height="45" rx="14" fill="#f4f1ff"/>
  <text x="1805" y="630" class="card-title">BBoard Compact contract</text>
  <text x="1805" y="682" class="card-mono">verifyDealFairness(price)</text>
  <text x="1805" y="714" class="card-mono">verifyDelivery(promisedQuality)</text>
  <text x="1805" y="753" class="card-text">Public state: dealCount · pass/fail flags</text>

  <!-- Public outputs -->
  <rect x="1725" y="850" width="570" height="128" rx="14" fill="#ffffff" stroke="#6d8cae" stroke-width="2"/>
  <text x="1753" y="889" class="card-title">Public output returned to browser</text>
  <text x="1753" y="925" class="card-text">Verification verdicts · contract address</text>
  <text x="1753" y="954" class="card-text">Fairness TX ID · delivery TX ID · receipt</text>

  <!-- DNS flow -->
  <path d="M 285 500 L 285 438" fill="none" stroke="#6e7f96" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="298" y="470" class="edge-label">DNS lookup</text>
  <path d="M 420 381 L 700 381" fill="none" stroke="#6e7f96" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="493" y="365" class="edge-label">A record</text>

  <!-- HTTPS browser to Caddy -->
  <path d="M 375 625 L 575 625 L 575 415 L 750 415" fill="none" stroke="#1d6ed8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="458" y="606" class="edge-label">HTTPS :443</text>
  <text x="457" y="648" class="note">web app + SSE stream</text>

  <!-- Caddy to express -->
  <path d="M 1000 415 L 1060 415" fill="none" stroke="#1d6ed8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1008" y="397" class="edge-label">:3000</text>

  <!-- Express to agents -->
  <path d="M 1170 500 L 1170 548 L 950 548 L 950 575" fill="none" stroke="#12a594" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <text x="985" y="540" class="edge-label">negotiation loop</text>

  <!-- Express to verifier -->
  <path d="M 1365 500 L 1365 575" fill="none" stroke="#7357dd" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <text x="1380" y="548" class="edge-label">accepted deal</text>

  <!-- Verifier to Docker services -->
  <path d="M 1565 630 L 1660 630 L 1660 418 L 1725 418" fill="none" stroke="#7357dd" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <text x="1588" y="608" class="edge-label">HTTP :6300</text>
  <path d="M 1565 681 L 1680 681 L 1680 535 L 2010 535 L 2010 490" fill="none" stroke="#7357dd" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <text x="1780" y="522" class="edge-label">HTTP/WS :8088</text>
  <path d="M 1565 732 L 1700 732 L 1700 565 L 2205 565 L 2205 490" fill="none" stroke="#7357dd" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <text x="2075" y="552" class="edge-label">WS :9944</text>

  <!-- Devnet to contract -->
  <path d="M 2205 490 L 2205 550 L 2050 550 L 2050 600" fill="none" stroke="#12a594" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <text x="2080" y="540" class="edge-label">submit + verify</text>
  <path d="M 2050 790 L 2050 850" fill="none" stroke="#1d6ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>

  <!-- Output back to browser -->
  <path d="M 1775 915 L 1660 915 L 1660 1100 L 480 1100 L 480 750 L 375 750" fill="none" stroke="#1d6ed8" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
  <text x="800" y="1084" class="edge-label">SSE: proof progress + public receipt metadata</text>

  <!-- Bottom legend -->
  <rect x="55" y="1120" width="2290" height="165" rx="16" fill="#f8fafc" stroke="#d9e1ea" stroke-width="2"/>
  <text x="85" y="1162" class="group-title">Trust and exposure model</text>
  <rect x="85" y="1190" width="20" height="20" rx="4" fill="#ffffff" stroke="#6d8cae" stroke-width="2"/>
  <text x="118" y="1207" class="legend">Public: browser UI, HTTPS, contract address, transaction IDs, pass/fail, proof receipt</text>
  <rect x="85" y="1232" width="20" height="20" rx="4" fill="#f4f1ff" stroke="#7357dd" stroke-width="2"/>
  <text x="118" y="1249" class="legend">Private: advertiser maximum CPM, publisher floor CPM, actual quality, wallet/private state</text>
  <rect x="1335" y="1190" width="20" height="20" rx="4" fill="#e9f8f4" stroke="#12a594" stroke-width="2"/>
  <text x="1368" y="1207" class="legend">VM-local only: Midnight node, indexer, proof server — ports 9944 / 8088 / 6300 are not public</text>
  <text x="85" y="1272" class="note">Demo scope: hosted application with a VM-local Midnight development network. No mainnet claim and no live token payment.</text>
</svg>
